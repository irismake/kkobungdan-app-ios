# CI 빌드 job 공통 준비: Xcode 선택 · xcbeautify · 가짜 xcconfig(시크릿 없음) · SPM 캐시
# 사용: - uses: ./.github/actions/ios-ci-setup   (checkout 다음에)
name: iOS CI setup
description: Select Xcode, ensure xcbeautify, write stub xcconfig, restore Swift package cache

inputs:
  xcode-version:
    description: 사용할 Xcode 버전
    required: true

runs:
  using: composite
  steps:
    - name: Select Xcode ${{ inputs.xcode-version }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Ensure xcbeautify
      shell: bash
      run: command -v xcbeautify >/dev/null || brew install xcbeautify

    # PR CI 는 배포용 Secrets 를 쓰지 않는다. 구성마다 다른 가짜 호스트로 xcconfig 를 만든다.
    - name: Write stub xcconfig (no secrets)
      shell: bash
      run: ./Scripts/ci/write-stub-secrets.sh

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: build/SourcePackages
        key: spm-${{ runner.os }}-${{ hashFiles('Kkobungdan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: spm-${{ runner.os }}-
