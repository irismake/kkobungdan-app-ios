# Staging 구성(스테이징 서버)으로 빌드해 TestFlight 외부 테스트 그룹(external_app_tester)에 배포한다.
# (Beta App Review 자동 제출, 승인되면 외부 테스터에게 자동 배포·알림)
#
#  - staging : 머지(push) 시 자동 실행 + 수동 실행 가능
#  - dev     : 수동 실행만 (Actions → TestFlight (Staging) → Run workflow → Branch: dev)
#  - hotfix/*: 수동 실행만 — main 에 넣기 전 실기기 확인용 (스테이징 API · STG 빌드)
#  - 그 외 브랜치에서는 실행하지 않는다.
# App Store 정식 심사 제출은 이 워크플로에서 하지 않는다 → release.yml (main)
name: TestFlight (Staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

# TestFlight 배포는 한 번에 하나만 (dev·staging 공통). 진행 중인 실행은 취소하지 않는다.
# GitHub 는 그룹당 대기 실행을 하나만 둬서, 대기 중에 새 실행이 오면 이전 대기 실행은 취소된다 → 최신 커밋 우선.
# App Store 배포(release.yml)와는 그룹을 나눠 main 배포가 TestFlight 때문에 취소되지 않게 한다.
# 두 워크플로가 같은 버전으로 동시에 돌아 빌드 번호가 겹치면 fastlane 이 번호를 다시 받아 재빌드한다.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # macos-26 이미지에서 iOS 플랫폼(SDK 26.5)이 함께 설치된 Xcode. (26.0.1 은 iOS 26.0 플랫폼이 없어 빌드 불가)
  XCODE_VERSION: "26.6"

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-26
    environment: staging
    # 빌드 + App Store Connect 빌드 처리 대기(외부 테스트 제출에 필요)
    timeout-minutes: 90

    # dev·staging·hotfix/* 외 브랜치에서 수동 실행하면 job 자체를 건너뛴다. (fastlane 에서도 한 번 더 검사)
    if: >-
      github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/heads/hotfix/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TestFlight "테스트할 내용" 을 커밋 로그로 작성

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # .ruby-version + Gemfile.lock

      - name: Write Secrets.Staging.xcconfig
        env:
          SECRETS_STAGING_XCCONFIG: ${{ secrets.SECRETS_STAGING_XCCONFIG }}
        run: |
          if [ -z "$SECRETS_STAGING_XCCONFIG" ]; then
            echo "::error::SECRETS_STAGING_XCCONFIG secret 이 비어 있습니다."
            exit 1
          fi
          echo "$SECRETS_STAGING_XCCONFIG" | base64 --decode > Kkobungdan/Secrets.Staging.xcconfig
          # public 저장소라 로그가 공개된다. 디코딩한 각 값을 로그에서 가린다.
          grep -E '^[[:space:]]*[A-Z_][A-Z0-9_]*[[:space:]]*=' Kkobungdan/Secrets.Staging.xcconfig \
            | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//' \
            | while IFS= read -r value; do
                case "$value" in ""|http|https) ;; *) echo "::add-mask::$value" ;; esac
              done

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Kkobungdan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # 선택: 비우면 App Store Connect TestFlight "테스트 정보" 저장값을 그대로 쓴다.
          BETA_CONTACT_EMAIL: ${{ secrets.BETA_CONTACT_EMAIL }}
          BETA_CONTACT_FIRST_NAME: ${{ secrets.BETA_CONTACT_FIRST_NAME }}
          BETA_CONTACT_LAST_NAME: ${{ secrets.BETA_CONTACT_LAST_NAME }}
          BETA_CONTACT_PHONE: ${{ secrets.BETA_CONTACT_PHONE }}
          BETA_DEMO_ACCOUNT_NAME: ${{ secrets.BETA_DEMO_ACCOUNT_NAME }}
          BETA_DEMO_ACCOUNT_PASSWORD: ${{ secrets.BETA_DEMO_ACCOUNT_PASSWORD }}
          BETA_REVIEW_NOTES: ${{ secrets.BETA_REVIEW_NOTES }}
        run: bundle exec fastlane beta

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-logs
          path: build/fastlane/logs
          retention-days: 7
