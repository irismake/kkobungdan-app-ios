# main 에 머지된 vX.Y.Z 태그를 Release 구성(운영 API)으로 빌드해 App Store 심사에 제출한다.
#
#  - 수동 실행만 허용 (Actions → App Store Release → Run workflow, 태그 입력)
#  - `production` 환경 승인자가 승인해야 job 이 시작된다 (Settings → Environments → production → Required reviewers)
#  - 심사 통과 후 출시는 App Store Connect 에서 수동 (automatic_release: false)
#
# Staging 빌드 제출 방지 (fastlane release lane):
#  1. 태그 == v<MARKETING_VERSION>, HEAD == 태그 커밋, 태그 커밋이 origin/main 에 포함
#  2. IPA Info.plist 검증: 구성=Release · 운영 API · 앱 이름에 STG 없음
#  3. 방금 올린 빌드 번호만 심사에 제출 (TestFlight 의 Staging 빌드는 선택되지 않음)
name: App Store Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "출시할 버전 태그 (예: v1.0.3) — main 에 머지된 커밋이어야 한다"
        required: true
        type: string

# TestFlight(Staging)·App Store(Release) 업로드는 같은 앱 레코드의 빌드 번호를 공유하므로
# 두 워크플로를 같은 그룹으로 묶어 한 번에 하나만 실행한다. (진행 중인 실행은 취소하지 않음)
# 참고: GitHub 는 그룹당 대기 실행을 하나만 둔다. 대기 중에 새 실행이 오면 이전 대기 실행은 취소된다.
concurrency:
  group: app-store-connect-upload
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.0.1"

jobs:
  release:
    name: Build & submit for App Store review
    runs-on: macos-26
    environment: production
    timeout-minutes: 120

    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::태그 형식이 올바르지 않습니다: $TAG (예: v1.0.3)"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0 # origin/main 포함 여부 검증

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Write Secrets.Release.xcconfig
        env:
          SECRETS_RELEASE_XCCONFIG: ${{ secrets.SECRETS_RELEASE_XCCONFIG }}
        run: |
          if [ -z "$SECRETS_RELEASE_XCCONFIG" ]; then
            echo "::error::SECRETS_RELEASE_XCCONFIG secret 이 비어 있습니다."
            exit 1
          fi
          echo "$SECRETS_RELEASE_XCCONFIG" | base64 --decode > Kkobungdan/Secrets.Release.xcconfig

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Kkobungdan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: fastlane release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bundle exec fastlane release

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: build/fastlane/logs
          retention-days: 7
