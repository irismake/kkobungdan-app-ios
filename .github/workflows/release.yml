# main 에 머지(push)되면 Release 구성(운영 API)으로 빌드해 App Store 심사에 자동 제출한다.
#
#  - main PR 머지 = 배포 승인. 별도 수동 실행·GitHub 승인 단계 없음.
#  - 심사 승인 후 실제 출시는 App Store Connect 에서 수동 (automatic_release: false)
#  - 릴리스 태그·GitHub Release 는 자동으로 만들지 않는다. (출시 후 수동 생성)
#
# fastlane release lane 이 하는 일
#  1. 버전 검증: App Store 출시 버전보다 높은지, 같은 버전이 이미 승인되지 않았는지, 심사 진행 중인 제출이 없는지
#  2. Release 구성 빌드 (빌드 번호 = App Store Connect 최대 번호 + 1, 커밋하지 않음)
#  3. IPA 검증: 구성=Release · 운영 API(스테이징 호스트 아님) · 앱 이름에 STG 없음
#  4. App Store Connect 업로드 → 방금 올린 빌드 번호만 심사 제출 (TestFlight 의 Staging 빌드는 선택되지 않음)
name: App Store Release

on:
  push:
    branches: [main]

# App Store 배포는 한 번에 하나만. 진행 중인 실행은 취소하지 않는다.
# (대기 중에 main 에 또 push 되면 이전 대기 실행은 취소되고 최신 커밋이 배포된다)
concurrency:
  group: appstore-release
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.0.1"

jobs:
  release:
    name: Build & submit for App Store review
    runs-on: macos-26
    # SECRETS_RELEASE_XCCONFIG 를 쓰기 위한 환경. 승인 단계를 두지 않으므로
    # production 환경의 Required reviewers 는 해제하고, Deployment branches 를 main 으로 제한한다.
    environment: production
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Write Secrets.Release.xcconfig
        env:
          SECRETS_RELEASE_XCCONFIG: ${{ secrets.SECRETS_RELEASE_XCCONFIG }}
        run: |
          if [ -z "$SECRETS_RELEASE_XCCONFIG" ]; then
            echo "::error::SECRETS_RELEASE_XCCONFIG secret 이 비어 있습니다."
            exit 1
          fi
          echo "$SECRETS_RELEASE_XCCONFIG" | base64 --decode > Kkobungdan/Secrets.Release.xcconfig
          # public 저장소라 로그가 공개된다. 디코딩한 각 값을 로그에서 가린다.
          grep -E '^[[:space:]]*[A-Z_][A-Z0-9_]*[[:space:]]*=' Kkobungdan/Secrets.Release.xcconfig \
            | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//' \
            | while IFS= read -r value; do
                case "$value" in ""|http|https) ;; *) echo "::add-mask::$value" ;; esac
              done

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Kkobungdan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: fastlane release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane release

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: build/fastlane/logs
          retention-days: 7
