# main 으로 가는 PR 에서 MARKETING_VERSION 이 App Store 에 낼 수 있는 버전인지 검증한다.
# 빌드·서명 없이 App Store Connect API 만 조회한다. (Linux 러너)
#
#  - App Store 출시 버전보다 낮거나 같으면 실패 (출시 1.0.3 → 1.0.4 이상만 허용)
#  - 같은 버전이 이미 승인(출시 대기 포함)됐으면 실패
#  - 같은 버전이 심사 대기/심사 중이면 실패 (자동 취소하지 않음)
#  - 아직 출시되지 않은 같은 버전의 재빌드·재제출(준비 중·거절됨)은 통과
#  - App Store Connect 조회 실패도 실패로 처리
#
# 실행 시점: main 대상 PR 생성·push, 그리고 main Merge Queue(머지 직전 상태로 한 번 더).
#   - main 의 Required check 는 PR 과 큐 양쪽에서 결과가 있어야 하므로 merge_group 에서도 실행한다.
#   - dev·staging 큐에서는 조건 불일치로 건너뛴다. (건너뜀 = 성공 보고, 해당 브랜치 Required 아님)
#
# 머지 차단: main 브랜치 보호의 Required status check 에 "Verify App Store version" 을 등록한다.
name: Version Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: version-check-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-version:
    # Required Status Check 이름. 바꾸면 브랜치 보호 설정도 같이 바꿔야 한다.
    name: Verify App Store version
    if: >-
      github.event_name != 'merge_group' ||
      github.event.merge_group.base_ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: fastlane verify_release_version
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::App Store Connect API Key secret 을 읽을 수 없습니다. (fork PR 에서는 secret 이 전달되지 않는다)"
            exit 1
          fi
          bundle exec fastlane verify_release_version
