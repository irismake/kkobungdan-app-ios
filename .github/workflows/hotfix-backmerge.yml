# hotfix/* 가 main 에 머지되면 main → dev 역반영 PR 을 자동으로 연다. (역반영 누락 방지)
#
#  - 역반영 PR 은 반드시 "Create a merge commit" 으로 머지한다. (dev 머지 큐는 Squash 라 우회 머지)
#    Squash 로 머지하면 이력이 갈라져 다음 staging → main PR 의 Branch policy 에서 막히고 충돌이 난다.
#  - 이 PR 은 GITHUB_TOKEN 으로 만들어지므로 PR 검사(CI)가 실행되지 않는다. 내용은 main 머지 큐에서 이미 검증됐다.
#  - 이미 열린 역반영 PR(main → dev)이 있으면 새로 만들지 않는다. (그 PR 에 이 hotfix 도 포함된다)
#
# 필요 설정: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
name: Hotfix back-merge

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  backmerge:
    name: Open main → dev back-merge PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect hotfix merge and open back-merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 이 push 를 만든 PR 의 출발 브랜치. API 로 찾고, 없으면 머지 커밋 메시지에서 읽는다.
          # (머지 커밋 메시지: "Merge pull request #N from owner/branch")
          head_ref="$(gh api "repos/$REPO/commits/$SHA/pulls" -q '.[0].head.ref // empty' 2>/dev/null || true)"
          pr_number="$(gh api "repos/$REPO/commits/$SHA/pulls" -q '.[0].number // empty' 2>/dev/null || true)"
          first_line="$(printf '%s\n' "$MESSAGE" | head -1)"
          if [ -z "$head_ref" ]; then
            head_ref="$(printf '%s' "$first_line" | sed -nE 's#^Merge pull request \#[0-9]+ from [^/]+/(.+)$#\1#p')"
            pr_number="$(printf '%s' "$first_line" | sed -nE 's#^Merge pull request \#([0-9]+) from .*#\1#p')"
          fi
          echo "출발 브랜치: ${head_ref:-알 수 없음} (PR #${pr_number:-?})"

          case "$head_ref" in
            hotfix/*) ;;
            *) echo "hotfix 머지가 아니므로 역반영 PR 을 만들지 않는다."; exit 0 ;;
          esac

          existing="$(gh pr list --repo "$REPO" --base dev --head main --state open --json number -q '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "이미 열린 역반영 PR #$existing 이 있다. (이 hotfix 도 그 PR 에 포함된다)"
            exit 0
          fi

          body="$(cat <<EOF
          ## hotfix 역반영: \`$head_ref\` (#$pr_number) → dev

          main 에 머지된 hotfix 를 dev 에 반영한다. 반영 후 평소처럼 dev → staging → main 으로 이어진다.

          ### ⚠️ 반드시 Merge commit 으로 머지
          - dev 머지 큐(Squash)에 넣지 말고, **우회 머지 → "Create a merge commit"** 으로 머지한다.
          - Squash 로 머지하면 이력이 갈라져 다음 \`staging → main\` PR 이 Branch policy 에서 막히고 충돌이 난다.

          ### 충돌이 나면
          - 보통 \`MARKETING_VERSION\` 이 충돌한다. **dev 버전을 hotfix 버전보다 높게** 맞춘다. (예: hotfix 1.0.3 → dev 1.0.4)
          - 로컬에서 \`git switch -c backmerge/<이름> origin/dev && git merge origin/main\` 으로 해결한 뒤,
            이 PR 을 닫고 \`backmerge/<이름>\` → dev PR 을 Merge commit 으로 머지해도 된다.

          > 이 PR 은 GitHub Actions 가 자동으로 만들어 PR 검사가 실행되지 않는다. 내용은 main 머지 큐에서 이미 검증됐다.
          EOF
          )"
          url="$(gh pr create --repo "$REPO" --base dev --head main \
            --title "backmerge: $head_ref (#$pr_number) → dev" --body "$body")"
          echo "역반영 PR: $url"
          echo "::notice title=hotfix 역반영 PR 생성::$url — Merge commit 으로 머지하세요."
          {
            echo "## 🔁 hotfix 역반영 PR 생성"
            echo "- $url"
            echo "- **Create a merge commit** 으로 머지 (dev 머지 큐 우회)"
          } >> "$GITHUB_STEP_SUMMARY"
