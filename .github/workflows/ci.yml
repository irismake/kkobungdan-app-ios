# PR 대상 브랜치에 따라 검사 수준을 나누는 CI. (CD 는 testflight.yml · release.yml)
#
#  PR 대상    | 실행하는 job (= Required Status Check 이름)
#  -----------|---------------------------------------------------------------
#  dev        | Branch policy · Lint · Build & unit tests (Debug)
#  staging    | Branch policy · Build (Staging)   (유닛 테스트는 dev PR 에서 이미 통과)
#  main       | Branch policy · Build (Release)   (+ version-check.yml 의 Verify App Store version)
#
#  - PR 에서만 실행한다. feature push · dev/staging/main 머지 후에는 실행하지 않는다.
#  - 같은 PR 이 갱신되면 이전 실행을 취소한다.
#  - 배포 인증서·배포용 Secrets 를 쓰지 않는다. 서명 없이 빌드하고, xcconfig 는 가짜 값
#    (Scripts/ci/write-stub-secrets.sh)으로 만든다. → fork PR 에서도 동작하고 로그·아티팩트에 민감정보가 없다.
#  - 각 job 의 실행 여부는 PR 대상 브랜치로만 정해진다. 그래서 보호 브랜치마다 위 표의 job 을
#    Required Status Check 로 등록하면 항상 실행되어 결과를 낸다. (조건 불일치로 건너뛴 job 은 "성공" 으로 보고되므로
#    다른 브랜치용 job 을 Required 로 등록하지 않는다)
name: iOS CI

on:
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # macos-15 이미지의 Xcode 26.0.1 (macos-26 보다 러너가 많아 대기가 짧다)
  XCODE_VERSION: "26.0.1"
  # 로컬과 같은 버전으로 고정한다. (버전마다 규칙이 달라 결과가 바뀐다)
  SWIFTFORMAT_VERSION: "0.60.1"
  SWIFTLINT_VERSION: "0.65.1"
  # SPM 패키지를 Package.resolved 그대로 쓰고, 산출물을 한곳에 모은다.
  XCODEBUILD_COMMON: >-
    -project Kkobungdan.xcodeproj
    -scheme Kkobungdan
    -clonedSourcePackagesDirPath build/SourcePackages
    -derivedDataPath build/DerivedData
    -disableAutomaticPackageResolution
    -skipPackagePluginValidation
    -skipMacroValidation
    CODE_SIGNING_ALLOWED=NO

jobs:
  # ── 공통: PR 출발 브랜치 검사 ─────────────────────────────
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "PR: $HEAD → $BASE"
          case "$BASE" in
            staging) allowed="dev" ;;
            main)    allowed="staging" ;;
            *)       echo "✓ $BASE 대상 PR 은 출발 브랜치 제한 없음"; exit 0 ;;
          esac
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::$BASE 로는 fork 저장소의 PR 을 받을 수 없습니다."
            exit 1
          fi
          if [ "$HEAD" != "$allowed" ]; then
            echo "::error::$BASE 로는 $allowed 브랜치에서 온 PR 만 머지할 수 있습니다. (현재: $HEAD)"
            exit 1
          fi
          echo "✓ $allowed → $BASE"

  # ── dev: 코드 스타일 ─────────────────────────────────────
  # macOS 가 필요 없으므로 Linux 러너에서 공식 Docker 이미지(버전 고정)로 실행한다. (몇 초 만에 시작)
  # 워크스페이스를 같은 경로로 마운트해 PR 주석의 파일 경로가 그대로 맞게 한다.
  lint:
    name: Lint
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcode 빌드 페이즈와 같은 범위·설정 (앱 소스 Kkobungdan/ · Kkobungdan/.swiftformat)
      - name: SwiftFormat ${{ env.SWIFTFORMAT_VERSION }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "ghcr.io/nicklockwood/swiftformat:${SWIFTFORMAT_VERSION}" \
            --lint --cache ignore --reporter github-actions-log Kkobungdan

      # Xcode 빌드 페이즈와 같은 설정. error 는 실패, warning 은 PR 주석으로만 표시한다.
      - name: SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}" \
            swiftlint lint --no-cache --config Kkobungdan/.swiftlint.yml --reporter github-actions-logging

  # ── dev: Debug 빌드 + 유닛 테스트 ────────────────────────
  unit-tests:
    name: Build & unit tests (Debug)
    if: github.base_ref == 'dev'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Write stub xcconfig (no secrets)
        run: ./Scripts/ci/write-stub-secrets.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Kkobungdan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick iPhone simulator
        run: |
          sim="$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/[[:space:]]*$//')"
          [ -n "$sim" ] || { echo "::error::사용 가능한 iPhone 시뮬레이터가 없습니다."; exit 1; }
          echo "SIMULATOR=$sim" >> "$GITHUB_ENV"
          echo "▶︎ $sim"

      - name: Build & test (KkobungdanTests)
        run: |
          set -o pipefail
          xcodebuild test $XCODEBUILD_COMMON \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -only-testing:KkobungdanTests \
            -resultBundlePath build/ci/UnitTests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: build/ci/UnitTests.xcresult
          retention-days: 7

  # ── staging: TestFlight 에 올릴 Staging 구성 빌드 검증 ────
  build-staging:
    name: Build (Staging)
    if: github.base_ref == 'staging'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Write stub xcconfig (no secrets)
        run: ./Scripts/ci/write-stub-secrets.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Kkobungdan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # 실제 기기용(arm64) 빌드. 서명 없이 컴파일·링크까지만 확인한다.
      - name: Build Staging (iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild build $XCODEBUILD_COMMON \
            -configuration Staging \
            -destination "generic/platform=iOS" \
            | xcbeautify --renderer github-actions

      - name: Verify Staging build configuration
        run: ./Scripts/ci/verify-build-config.sh Staging build/DerivedData/Build/Products/Staging-iphoneos/Kkobungdan.app

  # ── main: App Store 에 낼 Release 구성 빌드 검증 ──────────
  build-release:
    name: Build (Release)
    if: github.base_ref == 'main'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Write stub xcconfig (no secrets)
        run: ./Scripts/ci/write-stub-secrets.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Kkobungdan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build Release (iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild build $XCODEBUILD_COMMON \
            -configuration Release \
            -destination "generic/platform=iOS" \
            | xcbeautify --renderer github-actions

      # 운영 API 설정 검증: Release 가 Secrets.Release 를 읽고 스테이징 호스트가 아닌지, 앱 이름·ATS·암호화 신고.
      # (실제 운영 서버 값은 배포 시 fastlane verify_ipa! 가 다시 검증한다)
      - name: Verify Release build configuration
        run: ./Scripts/ci/verify-build-config.sh Release build/DerivedData/Build/Products/Release-iphoneos/Kkobungdan.app
